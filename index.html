<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Week">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Game Week — Vacation Scoreboard</title>
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: light;
  --page:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
  --good:#006300; --danger:#d03b3b; --danger-text:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --s9:#6b6862; /* meeple gray — the 9th slot is a neutral; its line is dashed and bar striped */
  --btn-ink:#0b0b0b; --btn-text:#fcfcfb; --wash:rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
    --good:#0ca30c; --danger:#e66767; --danger-text:#0d0d0d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#999488;
    --btn-ink:#f2f1ec; --btn-text:#0d0d0d; --wash:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
  --good:#0ca30c; --danger:#e66767; --danger-text:#0d0d0d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#999488;
  --btn-ink:#f2f1ec; --btn-text:#0d0d0d; --wash:rgba(255,255,255,.07);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input,select{font:inherit; color:var(--ink)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif; text-wrap:balance; margin:0}

.shell{max-width:640px; margin:0 auto; padding:0 14px}

/* ---------- header ---------- */
.app-head{display:flex; align-items:center; gap:10px; padding:18px 0 10px}
.app-head h1{font-size:24px; font-weight:800; letter-spacing:-.01em; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.day-chip{flex:none; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink2); border:1px solid var(--grid); border-radius:999px; padding:4px 10px; background:var(--card)}
.gear{flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
  border:1px solid var(--grid); background:var(--card); color:var(--ink2)}
.gear svg{width:20px; height:20px}
.gear:active{background:var(--wash)}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--ring); border-radius:14px; padding:16px; margin:12px 0}
.card-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:4px}
.card-h h2{font-size:17px; font-weight:800}
.card-sub{font-size:13px; color:var(--muted); margin:0 0 12px}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0}
.tile{background:var(--card); border:1px solid var(--ring); border-radius:14px; padding:12px 14px; min-width:0}
.tile .t-label{font-size:12px; color:var(--muted)}
.tile .t-value{font-size:21px; font-weight:650; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- standings ---------- */
.standing{display:grid; grid-template-columns:22px 42px minmax(0,1fr) auto; gap:0 12px; align-items:center; padding:10px 0}
.standing + .standing{border-top:1px solid var(--grid)}
.standing .rank{font-size:14px; font-weight:700; color:var(--muted); text-align:center}
.standing .who{min-width:0}
.standing .who .nm{font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.standing .who .sub{font-size:12.5px; color:var(--muted)}
.standing .bar-track{grid-column:3 / 5; margin-top:6px; height:18px; position:relative}
.standing .bar{height:18px; border-radius:0 4px 4px 0; background:var(--pc); min-width:2px}
/* the 9th (gray) player's bar is striped so its identity never rides on hue alone */
.standing.s9 .bar{background:repeating-linear-gradient(45deg, var(--pc) 0 5px, color-mix(in srgb, var(--pc) 45%, var(--card)) 5px 9px)}
.standing .pts{font-size:21px; font-weight:650; text-align:right}
.standing.lead .pts{font-size:24px}
.standing .pts small{display:block; font-size:11px; font-weight:400; color:var(--muted); margin-top:-2px}

/* meeple avatar */
.mavatar{position:relative; width:42px; height:42px; display:grid; place-items:center}
.mavatar svg.meeple{width:34px; height:34px; color:var(--pc); display:block}
.mavatar .crown{position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-8deg); width:18px; height:13px}
.mdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--pc); flex:none}

/* ---------- race chart ---------- */
.race-wrap{position:relative; touch-action:pan-y}
.race-wrap svg{display:block}
.race-wrap text{font:11.5px system-ui,-apple-system,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums}
.crosshair{position:absolute; top:0; width:1px; background:var(--baseline); pointer-events:none; display:none}
.race-tip{position:absolute; z-index:5; pointer-events:none; display:none; min-width:130px; max-width:210px;
  background:var(--card); border:1px solid var(--grid); border-radius:10px; padding:8px 10px;
  box-shadow:0 4px 14px rgba(0,0,0,.14); font-size:12.5px}
.race-tip .tt-title{font-weight:700; margin-bottom:4px; color:var(--ink)}
.race-tip .tt-row{display:flex; align-items:center; gap:6px; color:var(--ink2); padding:1px 0}
.race-tip .tt-row b{margin-left:auto; font-weight:650; color:var(--ink); font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px}
.legend .lg{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2)}

/* ---------- history ---------- */
.day-h{display:flex; align-items:baseline; gap:8px; margin:18px 2px 6px}
.day-h h2{font-size:15px; font-weight:800}
.day-h span{font-size:12px; color:var(--muted)}
.match .m-top{display:flex; align-items:baseline; gap:8px}
.match .m-top h3{font-size:16px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.match .m-top .m-meta{font-size:12px; color:var(--muted); flex:none; margin-left:auto}
.match .res{display:grid; grid-template-columns:34px 12px minmax(0,1fr) auto auto; gap:4px 8px; align-items:center; margin-top:10px}
.match .res .pl{font-size:12px; font-weight:700; color:var(--muted)}
.match .res .rn{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14.5px}
.match .res .sc{font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums; text-align:right}
.match .res .pp{font-size:13px; font-weight:650; color:var(--ink); font-variant-numeric:tabular-nums; text-align:right; min-width:34px}
.match .m-actions{display:flex; gap:14px; margin-top:10px}
.link-btn{font-size:13.5px; font-weight:650; color:var(--ink2); text-decoration:underline; text-underline-offset:3px}
.link-btn.danger{color:var(--danger)}

/* ---------- players ---------- */
.player-row{display:flex; align-items:center; gap:12px; padding:10px 0}
.player-row + .player-row{border-top:1px solid var(--grid)}
.player-row .pinfo{min-width:0; flex:1}
.player-row .pinfo .nm{font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.player-row .pinfo .sub{font-size:12.5px; color:var(--muted)}
.add-row{display:flex; gap:8px; margin-top:6px}
.add-row input{flex:1; min-width:0}

/* ---------- forms ---------- */
.field{margin:14px 0}
.field label{display:block; font-size:13px; font-weight:650; color:var(--ink2); margin-bottom:6px}
.tin{width:100%; background:var(--page); border:1px solid var(--grid); border-radius:10px; padding:10px 12px}
.tin:focus{outline:2px solid var(--ink); outline-offset:-1px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700;
  border-radius:12px; padding:12px 18px; background:var(--btn-ink); color:var(--btn-text)}
.btn:active{opacity:.85}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--baseline)}
.btn.small{padding:8px 14px; font-size:14px; border-radius:10px}
.btn.danger-solid{background:var(--danger); color:var(--danger-text)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; background:var(--page);
  border:1px solid var(--grid); border-radius:12px; padding:4px}
.seg button{padding:8px 4px; border-radius:9px; font-size:14px; font-weight:650; color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--btn-ink); color:var(--btn-text)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--baseline); border-radius:999px;
  padding:7px 13px; font-size:14.5px; font-weight:650; color:var(--ink2); position:relative}
.chip .mdot{width:12px; height:12px}
.chip[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); background:var(--wash)}
.chip .place-badge{position:absolute; top:-7px; right:-5px; min-width:18px; height:18px; border-radius:9px;
  background:var(--btn-ink); color:var(--btn-text); font-size:11px; font-weight:800; display:grid; place-items:center; padding:0 4px}
.score-row{display:grid; grid-template-columns:12px minmax(0,1fr) 34px 88px; gap:10px; align-items:center; padding:7px 0}
.score-row .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650}
.score-row .place{font-size:12px; font-weight:700; color:var(--muted); text-align:right}
.score-row input{text-align:right; font-variant-numeric:tabular-nums}
.switch{display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:650; color:var(--ink2); padding:6px 0}
.switch input{width:18px; height:18px; accent-color:var(--btn-ink)}
.radio-opt{display:flex; gap:10px; align-items:flex-start; padding:9px 0}
.radio-opt input{margin-top:3px; width:17px; height:17px; accent-color:var(--btn-ink)}
.radio-opt .r-title{font-weight:650}
.radio-opt .r-sub{font-size:13px; color:var(--muted)}
.form-err{display:none; color:var(--danger); font-size:13.5px; font-weight:650; margin:10px 0 0}
.form-err.show{display:block}
.hint{font-size:12.5px; color:var(--muted)}

/* ---------- empty states ---------- */
.empty{text-align:center; padding:36px 20px}
.empty .big{font-size:40px; line-height:1; margin-bottom:10px}
.empty h2{font-size:19px; font-weight:800; margin-bottom:6px}
.empty p{color:var(--ink2); font-size:14.5px; margin:0 0 16px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--card); border-top:1px solid var(--grid);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:grid; grid-template-columns:1fr 1fr auto 1fr 1fr; align-items:center; gap:2px}
.tabbar .tab{display:grid; justify-items:center; gap:2px; padding:6px 2px; border-radius:10px;
  font-size:11px; font-weight:650; color:var(--muted)}
.tabbar .tab svg{width:22px; height:22px}
.tabbar .tab[aria-current]{color:var(--ink)}
.tabbar .log-btn{width:54px; height:54px; margin:0 8px; border-radius:50%; background:var(--btn-ink); color:var(--btn-text);
  display:grid; place-items:center; box-shadow:0 4px 12px rgba(0,0,0,.22); transform:translateY(-10px)}
.tabbar .log-btn svg{width:26px; height:26px}
.tabbar .log-btn[disabled]{opacity:.35}

/* ---------- sheets ---------- */
.sheet-host{position:fixed; inset:0; z-index:40; display:none}
.sheet-host.open{display:block}
.sheet-back{position:absolute; inset:0; background:rgba(0,0,0,.42)}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow:auto; overscroll-behavior:contain;
  background:var(--card); border-radius:18px 18px 0 0; padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--baseline); margin:4px auto 8px}
.sheet .sh-head{display:flex; align-items:center; gap:10px; margin-bottom:2px}
.sheet .sh-head h2{font-size:19px; font-weight:800; flex:1}
.sheet .close{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--ink2); background:var(--wash)}
.sheet .foot{display:flex; gap:10px; margin-top:18px}
.sheet .foot .btn{flex:1}
@media (min-width:640px){ .sheet{left:50%; right:auto; transform:translateX(-50%); width:600px; border-radius:18px; bottom:24px} }

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:60; background:var(--btn-ink); color:var(--btn-text); font-size:14px; font-weight:650;
  padding:10px 16px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:88%; text-align:center}
.toast.show{opacity:1}

/* ---------- confetti ---------- */
.confetti{position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden}
.confetti i{position:absolute; width:8px; height:12px; border-radius:2px; will-change:transform; animation:cfall .95s ease-in forwards}
@keyframes cfall{
  0%{transform:translate(0,0) rotate(0); opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

      <path fill="currentColor" d="M50 8c8 0 14 6 14 13 0 4-2 8-5 10 3 1 6 3 8 6 3 4 9 6 15 8 6 2 10 5 10 10 0 4-3 7-8 7-7 0-13-2-18-5-1 6 0 11 3 17 3 6 6 11 6 15H61c-3 0-4-2-5-5l-4-12c-1-3-3-3-4 0l-4 12c-1 3-2 5-5 5H25c0-4 3-9 6-15 3-6 4-11 3-17-5 3-11 5-18 5-5 0-8-3-8-7 0-5 4-8 10-10 6-2 12-4 15-8 2-3 5-5 8-6-3-2-5-6-5-10 0-7 6-13 14-13z"/>

</svg>

<div class="shell">
  <header class="app-head">
    <h1 id="tripName">Game Week</h1>
    <span class="day-chip" id="dayChip">Day 1</span>
    <button class="gear" id="btnSettings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </header>

  <main>
    <section id="view-standings" aria-label="Standings"></section>
    <section id="view-history" aria-label="History" hidden></section>
    <section id="view-players" aria-label="Players" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="Main">
  <button class="tab" data-tab="standings" aria-current="page"><svg aria-hidden="true"><use href="#i-trophy"/></svg>Standings</button>
  <button class="tab" data-tab="history"><svg aria-hidden="true"><use href="#i-list"/></svg>History</button>
  <button class="log-btn" id="btnLog" aria-label="Log a game"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
  <button class="tab" data-tab="players"><svg aria-hidden="true"><use href="#i-people"/></svg>Players</button>
  <span></span>
</nav>

<div class="sheet-host" id="sheetHost" aria-hidden="true">
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Game Week — a vacation board-game scoreboard.
   All data lives in localStorage on this device. Matches store
   placements and a game weight; points are recomputed on every render.
===================================================================== */

const STORAGE_KEY = 'gameweek-v1';
const APP_VERSION = '1.6.1 · fairer big games';
const INSTALL_URL = 'https://marastefanic-cmd.github.io/alzatask/';
const MAX_PLAYERS = 9;
const SLOT_VARS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8','--s9'];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- state ---------- */
let state = null;
let storageOk = true;
let seqCounter = 0;

function freshState(){
  return {
    version: 1,
    trip: { name: 'Game Week', start: todayStr() },
    settings: {},
    players: [],           // {id, name, slot}
    matches: [],           // {id, seq, game, date, mode, lowWins, results:[{playerId, score|null, rank|null}]}
    gamePrefs: {}          // { lowercased game name: {lowWins} }
  };
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch(e){ storageOk = false; }
  if(raw){
    try {
      const parsed = JSON.parse(raw);
      state = sanitizeState(parsed) || freshState();
    } catch(e){ state = freshState(); }
  } else {
    state = freshState();
  }
  seqCounter = state.matches.reduce((m, x) => Math.max(m, x.seq || 0), 0);
}

function save(){
  if(!storageOk) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){
    storageOk = false;
    toast('Couldn’t save on this device — export a backup from Settings.');
  }
}

/* Validate an unknown parsed object into app state; returns null if unusable. */
function sanitizeState(o){
  if(!o || typeof o !== 'object') return null;
  const s = freshState();
  if(o.trip && typeof o.trip === 'object'){
    if(typeof o.trip.name === 'string' && o.trip.name.trim()) s.trip.name = o.trip.name.trim().slice(0,60);
    if(typeof o.trip.start === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(o.trip.start)) s.trip.start = o.trip.start;
  }
  const usedSlots = new Set();
  // Ids from a foreign file are untrusted: anything outside a safe charset is
  // regenerated, with a map so match results keep pointing at the right player.
  const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
  const idMap = new Map();
  if(Array.isArray(o.players)){
    for(const p of o.players.slice(0, MAX_PLAYERS)){
      if(!p || typeof p.name !== 'string' || !p.name.trim()) continue;
      let slot = Number.isInteger(p.slot) && p.slot >= 0 && p.slot < MAX_PLAYERS && !usedSlots.has(p.slot) ? p.slot : null;
      if(slot === null){ slot = 0; while(usedSlots.has(slot)) slot++; }
      if(slot >= MAX_PLAYERS) continue;
      usedSlots.add(slot);
      const rawId = typeof p.id === 'string' && p.id ? p.id : null;
      const id = (rawId && ID_RE.test(rawId) && !idMap.has(rawId)) ? rawId : uid();
      if(rawId) idMap.set(rawId, id);
      s.players.push({ id, name: p.name.trim().slice(0,40), slot });
    }
  }
  const ids = new Set(s.players.map(p => p.id));
  if(Array.isArray(o.matches)){
    for(const m of o.matches){
      if(!m || typeof m !== 'object' || !Array.isArray(m.results)) continue;
      const results = [];
      for(const r of m.results){
        const pid = (r && typeof r.playerId === 'string') ? idMap.get(r.playerId) : null;
        if(!pid || !ids.has(pid)) continue;
        if(results.some(x => x.playerId === pid)) continue;
        results.push({
          playerId: pid,
          score: (typeof r.score === 'number' && isFinite(r.score)) ? r.score : null,
          rank: (Number.isInteger(r.rank) && r.rank >= 1) ? r.rank : null
        });
      }
      if(results.length < 1) continue;
      s.matches.push({
        id: (typeof m.id === 'string' && ID_RE.test(m.id)) ? m.id : uid(),
        seq: Number.isInteger(m.seq) ? m.seq : 0,
        game: (typeof m.game === 'string' && m.game.trim()) ? m.game.trim().slice(0,60) : 'Game',
        date: (typeof m.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(m.date)) ? m.date : todayStr(),
        mode: ['winner','ranking','scores','teams'].includes(m.mode) ? m.mode : 'winner',
        lowWins: !!m.lowWins,
        weight: [1,2,3].includes(m.weight) ? m.weight : 2,
        results
      });
    }
    // Rebuild seq for matches missing one, preserving array order.
    let maxSeq = s.matches.reduce((a,m)=>Math.max(a,m.seq),0);
    for(const m of s.matches){ if(!m.seq) m.seq = ++maxSeq; }
  }
  if(o.gamePrefs && typeof o.gamePrefs === 'object'){
    for(const k of Object.keys(o.gamePrefs).slice(0,200)){
      const v = o.gamePrefs[k];
      if(v && typeof v === 'object') s.gamePrefs[String(k).slice(0,60)] = { lowWins: !!v.lowWins, weight: [1,2,3].includes(v.weight) ? v.weight : 2 };
    }
  }
  return s;
}

/* ---------- scoring ---------- */
const GHOST_GAMES = 2;   // padded onto everyone's game count so one lucky win can't clinch the week
const WEIGHT_LABELS = { 1: 'Light', 2: 'Standard', 3: 'Heavy' };

/* Beat a player, earn the game's weight in points: (players you finished ahead
   of) × weight. Ties count as level, not beaten; unranked participants (quick
   "Winner" entries) count as finished behind everyone who placed.
   In Scores games the margin matters too: each beaten opponent is worth
   1 + up to 0.5 extra, scaled by how decisively you beat them.
   The total is damped by √(field−1): big games pay more than duels, but
   sublinearly — a 9-player win is worth ~3 duels, not 8. */
function pointsFor(result, match){
  if(result.rank == null) return 0;
  let sum = 0;
  for(const x of match.results){
    if(x === result) continue;
    const behind = x.rank == null ? true : x.rank > result.rank;
    if(behind) sum += 1 + marginBonus(result, x, match);
  }
  const damp = Math.sqrt(Math.max(match.results.length - 1, 1));
  // quantize at the source so history "+pts" lines sum exactly to the standings total
  return Math.round(sum / damp * (match.weight || 2) * 10) / 10;
}

/* Relative margin of one pairwise win, in [0, 0.5]. The gap is scaled by the
   LARGER of (|a|+|b|) and the match's widest score gap: the first anchor reads
   2:0 as a shutout and 2:1 as narrow; the second stops a small gap that merely
   crosses zero (1 vs -1 in a wider field) from saturating at the maximum.
   Scale-free, and safe for golf scoring and negatives. */
function marginBonus(winner, loser, match){
  if(match.mode !== 'scores' || typeof winner.score !== 'number' || typeof loser.score !== 'number') return 0;
  const diff = match.lowWins ? loser.score - winner.score : winner.score - loser.score;
  const scale = Math.max(Math.abs(winner.score) + Math.abs(loser.score), matchSpread(match));
  if(!(diff > 0) || !(scale > 0)) return 0;
  return 0.5 * Math.min(diff / scale, 1);
}

function matchSpread(match){
  let mx = -Infinity, mn = Infinity;
  for(const r of match.results){
    if(typeof r.score === 'number'){
      if(r.score > mx) mx = r.score;
      if(r.score < mn) mn = r.score;
    }
  }
  return mx > mn ? mx - mn : 0;
}

/* The leaderboard metric: points per game, averaged as if everyone had played
   GHOST_GAMES extra scoreless games. Skipping a night doesn't sink you, and a
   single big win doesn't top the board for the whole week. */
function ratingOf(pts, played){ return pts / (played + GHOST_GAMES); }

/* Competition ranking (1,1,3) from scores. */
function ranksFromScores(entries, lowWins){
  const sorted = [...entries].sort((a,b) => lowWins ? a.score - b.score : b.score - a.score);
  const out = new Map();
  sorted.forEach((e,i) => {
    if(i > 0 && sorted[i-1].score === e.score) out.set(e.playerId, out.get(sorted[i-1].playerId));
    else out.set(e.playerId, i + 1);
  });
  return out;
}

function orderedMatches(){
  return [...state.matches].sort((a,b) => a.date === b.date ? a.seq - b.seq : (a.date < b.date ? -1 : 1));
}

function standings(){
  const rows = state.players.map(p => ({ p, pts: 0, wins: 0, played: 0 }));
  const byId = new Map(rows.map(r => [r.p.id, r]));
  for(const m of state.matches){
    for(const r of m.results){
      const row = byId.get(r.playerId);
      if(!row) continue;
      row.played++;
      if(r.rank === 1) row.wins++;
      row.pts += pointsFor(r, m);
    }
  }
  rows.forEach(r => { r.rating = ratingOf(r.pts, r.played); });
  rows.sort((a,b) => b.rating - a.rating || b.pts - a.pts || b.wins - a.wins || a.p.name.localeCompare(b.p.name));
  // competition rank by rating, compared at the same one-decimal precision fmtNum displays
  const key = r => Math.round(r.rating * 10);
  rows.forEach((r,i) => { r.rank = (i > 0 && key(rows[i-1]) === key(r)) ? rows[i-1].rank : i + 1; });
  return rows;
}

/* ---------- misc helpers ---------- */
function playerById(id){ return state.players.find(p => p.id === id); }
function slotVar(p){ return 'var(' + SLOT_VARS[p.slot] + ')'; }
function fmtNum(n){ return (Math.round(n * 10) / 10).toLocaleString('en-US'); }
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10]||s[v]||s[0]); }
function fmtDate(iso, opts){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', opts || {weekday:'short', month:'short', day:'numeric'});
}
function tripDayOf(iso){
  const ms = (new Date(iso + 'T12:00') - new Date(state.trip.start + 'T12:00'));
  return Math.floor(ms / 86400000) + 1;
}
function meeple(p, opts){
  opts = opts || {};
  return '<span class="mavatar" style="--pc:' + slotVar(p) + '"' + (opts.small ? ' data-small' : '') + '>' +
    '<svg class="meeple" role="img" aria-label="' + esc(p.name) + '"><use href="#i-meeple"/></svg>' +
    (opts.crown ? '<svg class="crown" aria-label="Current leader"><use href="#i-crown"/></svg>' : '') +
  '</span>';
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = document.createElement('div');
  host.className = 'confetti';
  const colors = state.players.length ? state.players.map(slotVar) : ['var(--s1)','var(--s2)','var(--s3)'];
  for(let i = 0; i < 22; i++){
    const el = document.createElement('i');
    el.style.background = colors[i % colors.length];
    el.style.left = (18 + Math.random() * 64) + '%';
    el.style.top = '-16px';
    el.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    el.style.setProperty('--dy', (200 + Math.random() * 260) + 'px');
    el.style.setProperty('--rot', (Math.random() * 500 - 250) + 'deg');
    el.style.animationDelay = (Math.random() * .18) + 's';
    host.appendChild(el);
  }
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 1400);
}

/* ---------- standings view ---------- */
function renderStandings(){
  const host = $('#view-standings');

    host.innerHTML =
      '<div class="card empty">' +
        '<div class="big" aria-hidden="true">' +

          '<svg width="52" height="52" style="color:var(--s2)"><use href="#i-meeple"/></svg>' +
          '<svg width="52" height="52" style="color:var(--s3)"><use href="#i-meeple"/></svg>' +
        '</div>' +
        '<h2>Who’s playing this week?</h2>' +
        '<p>Add your crew first — then log every game you play and watch the race unfold.</p>' +

  }

  const topGame = mostPlayedGame();

  let html = '';

  // stat tiles
  html += '<div class="tiles">' +
    tile('Games logged', String(ms.length)) +

  '</div>';

  // standings card
  html += '<div class="card"><div class="card-h"><h2>Standings</h2></div>' +
    '<p class="card-sub">Ranked by points per game · beat a player, earn the game’s weight</p>';
  if(ms.length === 0){
    html += '<div class="empty" style="padding:18px"><h2 style="font-size:16px">No games yet</h2>' +
      '<p>Tap the + button to log your first game.</p></div>';
  }
  html += rows.map(r => {
    const isLead = leaders.includes(r.p.id);
    return '<div class="standing' + (isLead ? ' lead' : '') + (r.p.slot === 8 ? ' s9' : '') + '" style="--pc:' + slotVar(r.p) + '">' +
      '<div class="rank">' + r.rank + '</div>' +
      meeple(r.p, {crown: isLead}) +
      '<div class="who"><div class="nm">' + esc(r.p.name) + '</div>' +
        '<div class="sub">' + fmtNum(r.pts) + ' pts · ' + r.wins + ' ' + (r.wins === 1 ? 'win' : 'wins') + ' · ' + r.played + ' ' + (r.played === 1 ? 'game' : 'games') + '</div></div>' +
      '<div class="pts">' + fmtNum(r.rating) + '<small>per game</small></div>' +
      '<div class="bar-track"><div class="bar" style="width:' + (maxRating > 0 ? (r.rating / maxRating * 100) : 0) + '%"></div></div>' +
    '</div>';
  }).join('');
  html += '</div>';

  // race chart card
  if(ms.length >= 1 && state.players.length >= 2){
    html += '<div class="card" id="raceCard"><div class="card-h"><h2>The race</h2></div>' +
      '<p class="card-sub">Points per game after each game — flat stretches mean they sat one out</p>' +
      '<div class="race-wrap" id="raceWrap">' +
        '<div id="raceSvg"></div>' +
        '<div class="crosshair" id="raceX"></div>' +
        '<div class="race-tip" id="raceTip"></div>' +
      '</div>' +
      '<div class="legend" id="raceLegend"></div>' +
    '</div>';
  }

  host.innerHTML = html;
  if(ms.length >= 1 && state.players.length >= 2) renderRace();
}

function tile(label, value){
  return '<div class="tile"><div class="t-label">' + esc(label) + '</div>' +
    '<div class="t-value">' + esc(value) + '</div></div>';
}

function mostPlayedGame(){
  const counts = {};
  for(const m of state.matches){
    const k = m.game;
    counts[k] = (counts[k] || 0) + 1;
  }
  let best = null, n = 0;
  for(const k in counts){ if(counts[k] > n){ n = counts[k]; best = k; } }
  return best;
}

/* ---------- race chart ---------- */
let raceData = null;

function renderRace(){
  const wrap = $('#raceWrap');
  if(!wrap) return;
  raceLeave();
  const ms = orderedMatches();
  const W = Math.max(wrap.clientWidth || 560, 280);
  const H = 224;
  const padL = 34, padR = 16, padT = 12, padB = 26;

  // rating trajectory per player, index 0 = start; flat segments = sat that one out
  const series = state.players.map(p => ({ p, pts: [0], acc: 0, n: 0 }));
  for(const m of ms){
    for(const s of series){
      const r = m.results.find(x => x.playerId === s.p.id);
      if(r){ s.acc += pointsFor(r, m); s.n++; }
      s.pts.push(s.n ? ratingOf(s.acc, s.n) : 0);
    }
  }
  const N = ms.length;
  const lead = standings()[0];
  // domain over every plotted point — early-week rating spikes sit far above the damped finals
  const dataMax = Math.max(1, ...series.flatMap(s => s.pts));
  const yTicks = niceTicks(dataMax);
  const yMax = yTicks[yTicks.length - 1];
  const X = i => padL + (W - padL - padR) * (i / Math.max(N, 1));
  const Y = v => padT + (H - padT - padB) * (1 - v / yMax);

  let g = '';
  // gridlines + y tick labels (hairline, solid)
  for(const t of yTicks){
    g += '<line x1="' + padL + '" y1="' + Y(t) + '" x2="' + (W - padR) + '" y2="' + Y(t) + '" stroke="var(--grid)" stroke-width="1"/>';
    g += '<text x="' + (padL - 7) + '" y="' + (Y(t) + 3.5) + '" text-anchor="end" fill="var(--muted)">' + t + '</text>';
  }
  // x ticks
  const step = Math.max(1, Math.ceil(N / 6));
  for(let i = step; i <= N; i += step){
    g += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" fill="var(--muted)">' + i + '</text>';
  }
  // baseline
  g += '<line x1="' + padL + '" y1="' + Y(0) + '" x2="' + (W - padR) + '" y2="' + Y(0) + '" stroke="var(--baseline)" stroke-width="1"/>';
  // lines + end dots
  for(const s of series){
    const c = slotVar(s.p);
    const d = s.pts.map((v,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    const dash = s.p.slot === 8 ? ' stroke-dasharray="7 5"' : '';
    g += '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + dash + '/>';
    g += '<circle cx="' + X(N).toFixed(1) + '" cy="' + Y(s.pts[N]).toFixed(1) + '" r="4.5" fill="' + c + '" stroke="var(--card)" stroke-width="2"/>';
  }
  // selective direct label: the current leader only
  if(lead && lead.rating > 0){
    const s = series.find(x => x.p.id === lead.p.id);
    if(s){
      const ly = Math.max(Y(s.pts[N]) - 9, 11);
      let nm = s.p.name.length > 10 ? s.p.name.slice(0, 10) + '…' : s.p.name;
      g += '<text x="' + (X(N) - 8) + '" y="' + ly + '" text-anchor="end" fill="var(--ink2)" font-weight="650">' + esc(nm) + ' · ' + fmtNum(s.pts[N]) + '</text>';
    }
  }

  $('#raceSvg').innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="Points-per-game rating for each player after each game">' + g + '</svg>';

  $('#raceLegend').innerHTML = state.players.map(p =>
    '<span class="lg" style="--pc:' + slotVar(p) + '"><span class="mdot"></span>' + esc(p.name) + '</span>'
  ).join('');

  raceData = { series, ms, N, W, H, padL, padR, padT, padB, X, Y };
}

function niceTicks(max){
  const raw = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = pow;
  for(const m of [1, 2, 5, 10]){ if(m * pow >= raw){ step = m * pow; break; } }
  if(step < 1) step = 1;   // points are whole numbers — no fractional gridlines
  const top = Math.ceil(max / step) * step;
  const out = [];
  for(let v = 0; v <= top + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

function raceHover(ev){
  if(!raceData) return;
  const wrap = $('#raceWrap');
  const rect = wrap.getBoundingClientRect();
  const px = ev.clientX - rect.left;
  const { N, padL, padR, W, H, padB, padT, X, series, ms } = raceData;
  const plotW = W - padL - padR;
  let i = Math.round((px - padL) / plotW * Math.max(N,1));
  i = Math.max(0, Math.min(N, i));

  const xpx = X(i);
  const xh = $('#raceX');
  xh.style.display = 'block';
  xh.style.left = xpx + 'px';
  xh.style.height = (H - padB) + 'px';

  const tip = $('#raceTip');
  const title = i === 0 ? 'Start' :
    '#' + i + ' · ' + esc(ms[i-1].game) + ' · ' + esc(fmtDate(ms[i-1].date, {month:'short', day:'numeric'}));
  const rows = [...series].sort((a,b) => b.pts[i] - a.pts[i]).map(s =>
    '<div class="tt-row" style="--pc:' + slotVar(s.p) + '"><span class="mdot"></span>' +
    '<span>' + esc(s.p.name) + '</span><b>' + fmtNum(s.pts[i]) + '</b></div>'
  ).join('');
  tip.innerHTML = '<div class="tt-title">' + title + '</div>' + rows;
  tip.style.display = 'block';
  const tw = tip.offsetWidth;
  const lx = xpx + tw + 20 < W ? xpx + 12 : xpx - tw - 12;
  tip.style.left = Math.max(0, Math.min(lx, W - tw)) + 'px';
  tip.style.top = (padT + 2) + 'px';
}
function raceLeave(){
  const xh = $('#raceX'), tip = $('#raceTip');
  if(xh) xh.style.display = 'none';
  if(tip) tip.style.display = 'none';
}

/* ---------- history view ---------- */
function renderHistory(){
  const host = $('#view-history');
  const ms = orderedMatches().reverse();
  if(ms.length === 0){
    host.innerHTML = '<div class="card empty"><h2>Nothing logged yet</h2>' +
      '<p>Every game you log shows up here, day by day.</p></div>';
    return;
  }
  let html = '';
  let curDay = null;
  for(const m of ms){
    if(m.date !== curDay){
      curDay = m.date;
      const dn = tripDayOf(m.date);
      html += '<div class="day-h"><h2>' + esc(fmtDate(m.date, {weekday:'long', month:'short', day:'numeric'})) + '</h2>' +
        (dn >= 1 ? '<span>Day ' + dn + '</span>' : '') + '</div>';
    }
    html += matchCard(m);
  }
  host.innerHTML = html;
  $$('#view-history [data-edit]').forEach(b => b.addEventListener('click', () => openLogSheet(b.dataset.edit)));
}

function matchCard(m){
  const P = m.results.length;
  const sorted = [...m.results].sort((a,b) => (a.rank ?? 99) - (b.rank ?? 99));
  const rows = sorted.map(r => {
    const p = playerById(r.playerId);
    if(!p) return '';
    const pts = pointsFor(r, m);
    return '<div class="pl">' + (r.rank ? ordinal(r.rank) : '—') + '</div>' +
      '<span class="mdot" style="--pc:' + slotVar(p) + '"></span>' +
      '<div class="rn">' + esc(p.name) + '</div>' +
      '<div class="sc">' + (r.score != null ? fmtNum(r.score) : '') + '</div>' +
      '<div class="pp">' + (pts > 0 ? '+' + fmtNum(pts) : '·') + '</div>';
  }).join('');
  const w = m.weight || 2;
  const nTeams = m.mode === 'teams' ? new Set(m.results.map(r => r.rank)).size : 0;
  return '<div class="card match">' +
    '<div class="m-top"><h3>' + esc(m.game) + '</h3>' +
      '<span class="m-meta">' + P + ' players' + (nTeams ? ' · ' + nTeams + ' teams' : '') +
      (w !== 2 ? ' · ' + WEIGHT_LABELS[w].toLowerCase() + ' ×' + w : '') +
      (m.mode === 'scores' && m.lowWins ? ' · low wins' : '') + '</span></div>' +
    '<div class="res">' + rows + '</div>' +
    '<div class="m-actions"><button class="link-btn" data-edit="' + esc(m.id) + '">Edit</button></div>' +
  '</div>';
}

/* ---------- players view ---------- */
function renderPlayers(){
  const host = $('#view-players');
  const rows = standings();
  const byId = new Map(rows.map(r => [r.p.id, r]));
  let html = '<div class="card"><div class="card-h"><h2>Players</h2></div>' +
    '<p class="card-sub">Everyone gets a color for the whole week · up to ' + MAX_PLAYERS + ' players</p>';
  if(state.players.length === 0){
    html += '<p class="hint" style="margin:4px 0 10px">No players yet. Add at least two to start logging games.</p>';
  }
  html += state.players.map(p => {
    const st = byId.get(p.id);
    return '<div class="player-row" style="--pc:' + slotVar(p) + '">' +
      meeple(p) +
      '<div class="pinfo"><div class="nm">' + esc(p.name) + '</div>' +
      '<div class="sub">' + fmtNum(st.pts) + ' pts · ' + st.wins + ' ' + (st.wins === 1 ? 'win' : 'wins') + ' · ' + st.played + ' ' + (st.played === 1 ? 'game' : 'games') + '</div></div>' +
      '<button class="btn ghost small" data-editp="' + esc(p.id) + '">Edit</button>' +
    '</div>';
  }).join('');
  if(state.players.length < MAX_PLAYERS){
    html += '<div class="add-row"><input class="tin" id="npName" placeholder="Player name" maxlength="40" ' +
      'autocomplete="off" enterkeyhint="done" aria-label="New player name">' +
      '<button class="btn" id="npAdd">Add</button></div>';
  } else {
    html += '<p class="hint" style="margin-top:10px">All ' + MAX_PLAYERS + ' color slots are taken.</p>';
  }
  html += '</div>';
  host.innerHTML = html;

  const add = () => {
    const inp = $('#npName');
    const name = inp.value.trim();
    if(!name) return;
    if(state.players.some(p => p.name.toLowerCase() === name.toLowerCase())){
      toast('There’s already a player called ' + name + '.');
      return;
    }
    let slot = 0;
    const used = new Set(state.players.map(p => p.slot));
    while(used.has(slot)) slot++;
    state.players.push({ id: uid(), name: name.slice(0,40), slot });
    save(); renderAll();
    const again = $('#npName');
    if(again) again.focus();
  };
  const addBtn = $('#npAdd');
  if(addBtn){
    addBtn.addEventListener('click', add);
    $('#npName').addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
  }
  $$('#view-players [data-editp]').forEach(b => b.addEventListener('click', () => openPlayerSheet(b.dataset.editp)));
}

/* =====================================================================
   SHEETS
===================================================================== */
let sheetDirtyCheck = null;   // set by sheets whose dismissal could lose work
let discardArmAt = 0, discardArmUntil = 0;

function openSheet(html){
  sheetDirtyCheck = null;
  discardArmAt = 0; discardArmUntil = 0;
  const host = $('#sheetHost');
  $('#sheetBody').innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  host.classList.add('open');
  host.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  sheetDirtyCheck = null;
  const host = $('#sheetHost');
  host.classList.remove('open');
  host.setAttribute('aria-hidden', 'true');
  $('#sheetBody').innerHTML = '';
  document.body.style.overflow = '';
}
/* Backdrop tap / Escape / X go through here: with unsaved input, the first
   attempt only warns, a second within 3s (but not a double-tap bounce) closes. */
function requestCloseSheet(){
  if(sheetDirtyCheck && sheetDirtyCheck()){
    const now = Date.now();
    if(now > discardArmUntil){
      discardArmAt = now;
      discardArmUntil = now + 3000;
      toast('Tap again to discard this game.');
      return;
    }
    if(now - discardArmAt < 500) return;
  }
  closeSheet();
}
/* Two-tap destructive confirm with a double-tap debounce and auto-disarm. */
function armButton(btn, armedLabel, onConfirm){
  btn.addEventListener('click', () => {
    const at = Number(btn.dataset.armedAt || 0);
    if(at && Date.now() - at > 500){ onConfirm(); return; }
    if(at) return;
    btn.dataset.armedAt = String(Date.now());
    btn.dataset.restore = btn.textContent;
    btn.textContent = armedLabel;
    btn.classList.add('danger-solid'); btn.classList.remove('ghost');
    setTimeout(() => {
      if(!btn.isConnected || !btn.dataset.armedAt) return;
      btn.textContent = btn.dataset.restore;
      delete btn.dataset.armedAt;
      btn.classList.remove('danger-solid'); btn.classList.add('ghost');
    }, 4000);
  });
}

/* ---------- log / edit match sheet ---------- */
let draft = null;

function openLogSheet(editId){
  const editing = editId ? state.matches.find(m => m.id === editId) : null;
  if(editId && !editing) return;
  if(state.players.length < 2){ toast('Add at least two players first.'); return; }

  if(editing){
    draft = {
      id: editing.id, seq: editing.seq, lowWinsTouched: true, weightTouched: true,
      weight: [1,2,3].includes(editing.weight) ? editing.weight : 2,
      game: editing.game, date: editing.date, mode: editing.mode, lowWins: editing.lowWins,
      participants: editing.results.map(r => r.playerId),
      winners: editing.mode === 'winner' ? editing.results.filter(r => r.rank === 1).map(r => r.playerId) : [],
      order: editing.mode === 'ranking' ? [...editing.results].sort((a,b) => a.rank - b.rank).map(r => r.playerId) : [],
      scores: editing.mode === 'scores' ? Object.fromEntries(editing.results.map(r => [r.playerId, r.score])) : {},
      teamOf: {}, teamOrder: []
    };
    if(editing.mode === 'teams'){
      // teams are the rank groups: members share their team's finishing position
      const byRank = new Map();
      editing.results.forEach(r => {
        const k = r.rank ?? 0;
        if(!byRank.has(k)) byRank.set(k, []);
        byRank.get(k).push(r.playerId);
      });
      [...byRank.keys()].sort((a,b) => a - b).forEach((rk, i) => {
        byRank.get(rk).forEach(pid => { draft.teamOf[pid] = i + 1; });
        draft.teamOrder.push(i + 1);
      });
    }
  } else {
    draft = {
      id: null, seq: null, lowWinsTouched: false, weightTouched: false, weight: 2,
      game: '', date: todayStr(), mode: 'winner', lowWins: false,
      participants: state.players.map(p => p.id),
      winners: [], order: [], scores: {}, teamOf: {}, teamOrder: []
    };
  }

  const gameNames = [...new Set(state.matches.map(m => m.game))].sort();
  openSheet(
    '<div class="sh-head"><h2>' + (editing ? 'Edit game' : 'Log a game') + '</h2>' +
      '<button class="close" id="shClose" aria-label="Close"><svg width="18" height="18"><use href="#i-x"/></svg></button></div>' +

    '<div class="field"><label for="fGame">What did you play?</label>' +
      '<input class="tin" id="fGame" list="gameList" placeholder="Catan, Codenames, Ping-pong…" maxlength="60" value="' + esc(draft.game) + '">' +
      '<datalist id="gameList">' + gameNames.map(g => '<option value="' + esc(g) + '">').join('') + '</datalist></div>' +

    '<div class="field"><label for="fDate">When?</label>' +
      '<input class="tin" id="fDate" type="date" value="' + esc(draft.date) + '"></div>' +

    '<div class="field"><label>How heavy a game is it?</label>' +
      '<div class="seg" id="fWeight" role="group" aria-label="Game weight">' +
        '<button data-weight="1" aria-pressed="false">Light ×1</button>' +
        '<button data-weight="2" aria-pressed="false">Standard ×2</button>' +
        '<button data-weight="3" aria-pressed="false">Heavy ×3</button>' +
      '</div></div>' +

    '<div class="field"><label>Who played?</label><div class="chips" id="fWho"></div></div>' +

    '<div class="field"><label>How do you want to record it?</label>' +
      '<div class="seg" id="fMode" role="group" aria-label="Result type">' +
        '<button data-mode="winner" aria-pressed="false">Winner</button>' +
        '<button data-mode="ranking" aria-pressed="false">Ranking</button>' +
        '<button data-mode="scores" aria-pressed="false">Scores</button>' +
        '<button data-mode="teams" aria-pressed="false">Teams</button>' +
      '</div></div>' +

    '<div class="field" id="fModeArea"></div>' +
    '<p class="form-err" id="fErr" role="alert"></p>' +
    '<div class="foot">' +
      (editing ? '<button class="btn ghost" id="fDelete">Delete</button>' : '') +
      '<button class="btn" id="fSave">' + (editing ? 'Save changes' : 'Save game') + '</button>' +
    '</div>'
  );

  // Discard guard: dismissing this sheet with unsaved input takes two taps.
  // A new entry counts as dirty once anything meaningful is typed; an edit
  // counts as dirty once it differs from the match it was opened with.
  const snap = () => JSON.stringify([draft.game.trim(), draft.date, draft.mode, draft.lowWins, draft.weight,
    [...draft.participants].sort(), [...draft.winners].sort(), draft.order,
    Object.entries(draft.scores).filter(([,v]) => String(v ?? '').trim() !== '').sort(),
    Object.entries(draft.teamOf).sort(), draft.teamOrder]);
  if(editing){
    const initialSnap = snap();
    sheetDirtyCheck = () => snap() !== initialSnap;
  } else {
    sheetDirtyCheck = () => !!(draft.game.trim() || draft.winners.length || draft.order.length ||
      draft.teamOrder.length || draft.weightTouched ||
      Object.values(draft.scores).some(v => String(v ?? '').trim() !== ''));
  }

  $('#shClose').addEventListener('click', requestCloseSheet);
  $('#fGame').addEventListener('input', e => {
    draft.game = e.target.value;
    applyGamePref();
    const lw = $('#fLow');
    if(lw && lw.checked !== draft.lowWins){ lw.checked = draft.lowWins; updatePlacePreview(); }
  });
  $('#fDate').addEventListener('change', e => { draft.date = e.target.value || todayStr(); });
  $$('#fMode button').forEach(b => b.addEventListener('click', () => {
    draft.mode = b.dataset.mode;
    applyGamePref();
    renderModeSeg(); renderModeArea();
  }));
  $$('#fWeight button').forEach(b => b.addEventListener('click', () => {
    draft.weight = Number(b.dataset.weight);
    draft.weightTouched = true;
    renderWeightSeg();
  }));
  $('#fSave').addEventListener('click', saveMatch);
  const del = $('#fDelete');
  if(del) armButton(del, 'Really delete?', () => {
    state.matches = state.matches.filter(m => m.id !== draft.id);
    save(); closeSheet(); renderAll(); toast('Game deleted.');
  });

  renderWho(); renderModeSeg(); renderWeightSeg(); renderModeArea();
}

/* Apply the remembered per-game defaults (weight, lowest-wins) — but never
   override an explicit choice in this sheet or the values of an edited match. */
function applyGamePref(){
  if(!draft) return;
  const pref = state.gamePrefs[draft.game.trim().toLowerCase()];
  if(!draft.weightTouched){
    draft.weight = (pref && [1,2,3].includes(pref.weight)) ? pref.weight : 2;
    renderWeightSeg();
  }
  if(draft.mode === 'scores' && !draft.lowWinsTouched){
    draft.lowWins = pref ? !!pref.lowWins : false;
  }
}

function renderWeightSeg(){
  $$('#fWeight button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.weight) === draft.weight)));
}

function renderWho(){
  $('#fWho').innerHTML = state.players.map(p => {
    const on = draft.participants.includes(p.id);
    return '<button class="chip" style="--pc:' + slotVar(p) + '" data-pid="' + esc(p.id) + '" aria-pressed="' + on + '">' +
      '<span class="mdot"></span>' + esc(p.name) + '</button>';
  }).join('');
  $$('#fWho .chip').forEach(c => c.addEventListener('click', () => {
    const id = c.dataset.pid;
    if(draft.participants.includes(id)){
      draft.participants = draft.participants.filter(x => x !== id);
      draft.winners = draft.winners.filter(x => x !== id);
      draft.order = draft.order.filter(x => x !== id);
      delete draft.scores[id];
      delete draft.teamOf[id];
    } else {
      draft.participants.push(id);
    }
    if(draft.mode === 'teams') draft.teamOrder = [];   // roster changed — finishing order is stale
    renderWho(); renderModeArea();
  }));
}

function renderModeSeg(){
  $$('#fMode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === draft.mode)));
}

function participantsInOrder(){
  return state.players.filter(p => draft.participants.includes(p.id));
}

function renderModeArea(){
  const host = $('#fModeArea');
  const ps = participantsInOrder();

  if(draft.mode === 'winner'){
    host.innerHTML = '<label style="display:block" class="hint">Tap the winner — or several, for co-op wins. Everyone else just gets a game played.</label>' +
      '<div class="chips" style="margin-top:8px">' + ps.map(p => {
        const on = draft.winners.includes(p.id);
        return '<button class="chip" style="--pc:' + slotVar(p) + '" data-win="' + esc(p.id) + '" aria-pressed="' + on + '">' +
          '<span class="mdot"></span>' + esc(p.name) + (on ? ' 🏆' : '') + '</button>';
      }).join('') + '</div>';
    $$('#fModeArea [data-win]').forEach(c => c.addEventListener('click', () => {
      const id = c.dataset.win;
      draft.winners = draft.winners.includes(id) ? draft.winners.filter(x => x !== id) : [...draft.winners, id];
      renderModeArea();
    }));

  } else if(draft.mode === 'ranking'){
    host.innerHTML = '<label style="display:block" class="hint">Tap players in finishing order — first tap is 1st place. Tap again to remove.</label>' +
      '<div class="chips" style="margin-top:8px">' + ps.map(p => {
        const idx = draft.order.indexOf(p.id);
        return '<button class="chip" style="--pc:' + slotVar(p) + '" data-ord="' + esc(p.id) + '" aria-pressed="' + (idx >= 0) + '">' +
          '<span class="mdot"></span>' + esc(p.name) +
          (idx >= 0 ? '<span class="place-badge">' + (idx + 1) + '</span>' : '') + '</button>';
      }).join('') + '</div>' +
      (draft.order.length ? '<p style="margin:10px 0 0"><button class="link-btn" id="ordClear">Clear order</button></p>' : '');
    $$('#fModeArea [data-ord]').forEach(c => c.addEventListener('click', () => {
      const id = c.dataset.ord;
      draft.order = draft.order.includes(id) ? draft.order.filter(x => x !== id) : [...draft.order, id];
      renderModeArea();
    }));
    const oc = $('#ordClear');
    if(oc) oc.addEventListener('click', () => { draft.order = []; renderModeArea(); });

  } else if(draft.mode === 'teams'){
    const maxTeam = Math.min(4, ps.length);
    for(const p of ps) if(!draft.teamOf[p.id]) draft.teamOf[p.id] = 1;
    const teamsInUse = [...new Set(ps.map(p => draft.teamOf[p.id]))].sort((a,b) => a - b);
    let h = '<label style="display:block" class="hint">Tap a player to move them to the next team.</label>' +
      '<div class="chips" style="margin-top:8px">' + ps.map(p =>
        '<button class="chip" style="--pc:' + slotVar(p) + '" data-team="' + esc(p.id) + '" aria-pressed="true">' +
        '<span class="mdot"></span>' + esc(p.name) + '<span class="place-badge">T' + draft.teamOf[p.id] + '</span></button>'
      ).join('') + '</div>';
    if(teamsInUse.length >= 2){
      h += '<label style="display:block; margin-top:16px" class="hint">Now tap the teams in finishing order — first tap won.</label>' +
        '<div class="chips" style="margin-top:8px">' + teamsInUse.map(t => {
          const members = ps.filter(p => draft.teamOf[p.id] === t).map(p => p.name).join(' + ');
          const idx = draft.teamOrder.indexOf(t);
          return '<button class="chip" data-tord="' + t + '" aria-pressed="' + (idx >= 0) + '">' +
            'Team ' + t + ' · ' + esc(members) +
            (idx >= 0 ? '<span class="place-badge">' + (idx + 1) + '</span>' : '') + '</button>';
        }).join('') + '</div>' +
        (draft.teamOrder.length ? '<p style="margin:10px 0 0"><button class="link-btn" id="tordClear">Clear order</button></p>' : '');
    } else {
      h += '<p class="hint" style="margin-top:10px">Everyone’s on one team so far — move someone to Team 2.</p>';
    }
    host.innerHTML = h;
    $$('#fModeArea [data-team]').forEach(c => c.addEventListener('click', () => {
      const id = c.dataset.team;
      const cur = draft.teamOf[id] || 1;
      draft.teamOf[id] = cur >= maxTeam ? 1 : cur + 1;
      draft.teamOrder = [];   // grouping changed — old finishing order is stale
      renderModeArea();
    }));
    $$('#fModeArea [data-tord]').forEach(c => c.addEventListener('click', () => {
      const t = Number(c.dataset.tord);
      draft.teamOrder = draft.teamOrder.includes(t) ? draft.teamOrder.filter(x => x !== t) : [...draft.teamOrder, t];
      renderModeArea();
    }));
    const tc = $('#tordClear');
    if(tc) tc.addEventListener('click', () => { draft.teamOrder = []; renderModeArea(); });

  } else { // scores
    host.innerHTML =
      '<label class="switch"><input type="checkbox" id="fLow"' + (draft.lowWins ? ' checked' : '') + '> Lowest score wins (golf-style)</label>' +
      ps.map((p, i) =>
        '<div class="score-row" style="--pc:' + slotVar(p) + '"><span class="mdot"></span>' +
        '<div class="nm">' + esc(p.name) + '</div>' +
        '<div class="place" data-place="' + esc(p.id) + '"></div>' +
        '<input class="tin" inputmode="decimal" autocomplete="off" data-score="' + esc(p.id) + '" ' +
          'enterkeyhint="' + (i < ps.length - 1 ? 'next' : 'done') + '" ' +
          'value="' + (draft.scores[p.id] != null ? esc(String(draft.scores[p.id])) : '') + '" ' +
          'placeholder="0" aria-label="Score for ' + esc(p.name) + '"></div>'
      ).join('');
    $('#fLow').addEventListener('change', e => {
      draft.lowWins = e.target.checked;
      draft.lowWinsTouched = true;
      updatePlacePreview();
    });
    $$('#fModeArea [data-score]').forEach(inp => {
      inp.addEventListener('input', () => { draft.scores[inp.dataset.score] = inp.value; updatePlacePreview(); });
      inp.addEventListener('keydown', e => {
        if(e.key !== 'Enter') return;
        const all = $$('#fModeArea [data-score]');
        const i = all.indexOf(inp);
        if(i >= 0 && i < all.length - 1) all[i + 1].focus(); else inp.blur();
      });
    });
    updatePlacePreview();
  }
}

/* Refresh the little "1st / 2nd" badges beside score inputs without
   re-rendering the form (a re-render mid-typing would steal focus). */
function updatePlacePreview(){
  const ps = participantsInOrder();
  const allIn = ps.length > 0 && ps.every(p => isNum(draft.scores[p.id]));
  const ranks = allIn ? ranksFromScores(ps.map(p => ({ playerId: p.id, score: scoreNum(draft.scores[p.id]) })), draft.lowWins) : null;
  $$('#fModeArea [data-place]').forEach(el => {
    el.textContent = ranks ? ordinal(ranks.get(el.dataset.place)) : '';
  });
}

/* Commas are ambiguous: "1,500" is a thousands separator, "3,5" a decimal.
   Anything else with a comma is rejected so a typo can't silently mis-rank. */
function scoreNum(v){
  let s = String(v).trim().replace(/\s+/g, '');
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else if(/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else if(s.includes(',')) return NaN;
  return Number(s);
}
function isNum(v){
  if(v == null || String(v).trim() === '') return false;
  return isFinite(scoreNum(v));
}

function saveMatch(){
  const err = $('#fErr');
  const fail = msg => { err.textContent = msg; err.classList.add('show'); };
  err.classList.remove('show');

  const game = $('#fGame').value.trim();
  draft.game = game;
  if(!game) return fail('Give the game a name.');
  if(!draft.date || !/^\d{4}-\d{2}-\d{2}$/.test(draft.date)) return fail('Pick a date.');
  const ps = participantsInOrder();
  if(ps.length < 2) return fail('Pick at least two players.');

  let results;
  if(draft.mode === 'winner'){
    if(draft.winners.length < 1) return fail('Tap at least one winner.');
    results = ps.map(p => ({ playerId: p.id, score: null, rank: draft.winners.includes(p.id) ? 1 : null }));
  } else if(draft.mode === 'ranking'){
    if(draft.order.length !== ps.length) return fail('Rank everyone — ' + (ps.length - draft.order.length) + ' still missing.');
    results = draft.order.map((pid, i) => ({ playerId: pid, score: null, rank: i + 1 }));
  } else if(draft.mode === 'teams'){
    for(const p of ps) if(!draft.teamOf[p.id]) draft.teamOf[p.id] = 1;
    const teamsInUse = [...new Set(ps.map(p => draft.teamOf[p.id]))];
    if(teamsInUse.length < 2) return fail('Split the players into at least two teams.');
    if(draft.teamOrder.length !== teamsInUse.length || !teamsInUse.every(t => draft.teamOrder.includes(t)))
      return fail('Tap the teams in finishing order — every team needs a place.');
    results = ps.map(p => ({ playerId: p.id, score: null, rank: draft.teamOrder.indexOf(draft.teamOf[p.id]) + 1 }));
  } else {
    for(const p of ps){
      if(!isNum(draft.scores[p.id])) return fail('Enter a score for ' + p.name + '.');
    }
    const entries = ps.map(p => ({ playerId: p.id, score: scoreNum(draft.scores[p.id]) }));
    const ranks = ranksFromScores(entries, draft.lowWins);
    results = entries.map(e => ({ playerId: e.playerId, score: e.score, rank: ranks.get(e.playerId) }));
  }

  const prefKey = game.toLowerCase();
  const prevPref = state.gamePrefs[prefKey] || {};
  state.gamePrefs[prefKey] = {
    lowWins: draft.mode === 'scores' ? !!draft.lowWins : !!prevPref.lowWins,
    weight: draft.weight
  };

  if(draft.id){
    const i = state.matches.findIndex(m => m.id === draft.id);
    state.matches[i] = { id: draft.id, seq: draft.seq, game, date: draft.date, mode: draft.mode, lowWins: !!draft.lowWins, weight: draft.weight, results };
    toast('Game updated.');
  } else {
    state.matches.push({ id: uid(), seq: ++seqCounter, game, date: draft.date, mode: draft.mode, lowWins: !!draft.lowWins, weight: draft.weight, results });
    const winners = results.filter(r => r.rank === 1).map(r => playerById(r.playerId)).filter(Boolean).map(p => p.name);
    toast(winners.length ? winners.join(' & ') + ' take' + (winners.length > 1 ? '' : 's') + ' it! 🏆' : 'Game saved.');
    confetti();
  }
  save(); closeSheet();
  switchTab('standings');
  renderAll();
}

/* ---------- player sheet ---------- */
function openPlayerSheet(pid){
  const p = playerById(pid);
  if(!p) return;
  const hasResults = state.matches.some(m => m.results.some(r => r.playerId === pid));
  openSheet(
    '<div class="sh-head">' + meeple(p) + '<h2>' + esc(p.name) + '</h2>' +
      '<button class="close" id="shClose" aria-label="Close"><svg width="18" height="18"><use href="#i-x"/></svg></button></div>' +
    '<div class="field"><label for="pName">Name</label>' +
      '<input class="tin" id="pName" maxlength="40" value="' + esc(p.name) + '"></div>' +
    (hasResults
      ? '<p class="hint">' + esc(p.name) + ' has logged games, so they can’t be removed — that would rewrite history.</p>'
      : '') +
    '<div class="foot">' +
      (!hasResults ? '<button class="btn ghost" id="pDelete">Remove</button>' : '') +
      '<button class="btn" id="pSave">Save</button>' +
    '</div>'
  );
  $('#shClose').addEventListener('click', closeSheet);
  $('#pSave').addEventListener('click', () => {
    const name = $('#pName').value.trim();
    if(!name){ toast('Name can’t be empty.'); return; }
    if(state.players.some(x => x.id !== pid && x.name.toLowerCase() === name.toLowerCase())){
      toast('There’s already a player called ' + name + '.'); return;
    }
    p.name = name.slice(0,40);
    save(); closeSheet(); renderAll();
  });
  const del = $('#pDelete');
  if(del) armButton(del, 'Really remove?', () => {
    state.players = state.players.filter(x => x.id !== pid);
    save(); closeSheet(); renderAll(); toast('Player removed.');
  });
}

/* ---------- settings sheet ---------- */
function openSettingsSheet(){
  openSheet(
    '<div class="sh-head"><h2>Settings</h2>' +
      '<button class="close" id="shClose" aria-label="Close"><svg width="18" height="18"><use href="#i-x"/></svg></button></div>' +

    '<div class="field"><label for="sName">Scoreboard name</label>' +
      '<input class="tin" id="sName" maxlength="60" value="' + esc(state.trip.name) + '"></div>' +

    '<div class="field"><label for="sStart">First day of the trip</label>' +
      '<input class="tin" id="sStart" type="date" value="' + esc(state.trip.start) + '"></div>' +

    '<div class="field"><label>How scoring works</label>' +
      '<p class="hint" style="font-size:13.5px">Beat a player, earn the game’s weight in points: Light ×1, Standard ×2, Heavy ×3 — ' +
      'damped by the crowd (÷ √(players − 1)), so a 9-player win is worth about three duels, not eight. ' +
      'The board ranks <b>points per game</b> (with two “ghost games” added), so skipping a night doesn’t sink you — ' +
      'and one lucky win can’t clinch the week. ' +
      'Ties count as level, not beaten; quick “Winner” entries pay winners only. ' +
      'In team games your team’s finish is yours: you beat everyone on teams behind you, and teammates count as level. ' +
      'In score games, margins matter: each player you beat is worth up to +50% extra the more decisively you beat them — ' +
      'a 2:0 shutout pays the full bonus, a 2:1 squeaker barely any.</p></div>' +

    '<div class="field"><label>Put it on your phone</label>' +
      (location.href.startsWith(INSTALL_URL)
        ? '<p class="hint">You’re on the installable site. In Safari (iPhone) or Chrome (Android), tap Share → <b>Add to Home Screen</b>. ' +
          'It becomes a full-screen app that works offline.</p>'
        : '<p class="hint">This copy is a preview and can’t be added to a home screen. The installable app lives at<br>' +
          '<a class="link-btn" href="' + INSTALL_URL + '" target="_blank" rel="noopener">' + INSTALL_URL.replace('https://','') + '</a><br>' +
          'Open that in Safari (long-press to copy if tapping doesn’t work), then Share → <b>Add to Home Screen</b>.</p>') +
      '<p class="hint" style="margin-top:8px">Heads-up: each copy keeps its <b>own</b> scoreboard — install first, ' +
      'or move your games over with Export → Import.</p></div>' +

    '<div class="field"><label>Your data</label>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap">' +
        '<button class="btn ghost small" id="sExport">Export backup</button>' +
        '<button class="btn ghost small" id="sImport">Import backup</button>' +
        '<input type="file" id="sFile" accept="application/json,.json" class="sr">' +
      '</div>' +
      '<p class="hint" style="margin-top:8px">Everything lives on this phone. One of you is the scorekeeper — export a backup now and then, or to hand the scoreboard to another phone.</p></div>' +

    '<div class="field"><label>Danger zone</label>' +
      '<button class="btn ghost small" id="sReset">Start over…</button></div>' +

    '<p class="hint" style="text-align:center; margin-top:18px">Game Week ' + esc(APP_VERSION) +
      ' · <button class="link-btn" id="sUpdate">check for updates</button></p>' +

    '<div class="foot"><button class="btn" id="sSave">Done</button></div>'
  );

  $('#shClose').addEventListener('click', closeSheet);
  $('#sSave').addEventListener('click', () => {
    const name = $('#sName').value.trim();
    if(name) state.trip.name = name.slice(0,60);
    const st = $('#sStart').value;
    if(/^\d{4}-\d{2}-\d{2}$/.test(st)) state.trip.start = st;
    save(); closeSheet(); renderAll();
  });

  $('#sExport').addEventListener('click', exportData);
  $('#sImport').addEventListener('click', () => $('#sFile').click());
  $('#sFile').addEventListener('change', importData);
  $('#sUpdate').addEventListener('click', checkForUpdates);

  armButton($('#sReset'), 'Really erase everything?', () => {
    state = freshState();
    save(); closeSheet(); renderAll(); toast('Fresh scoreboard — have a great week!');
  });
}

function exportData(){
  const json = JSON.stringify(state, null, 2);
  const fname = 'game-week-backup-' + todayStr() + '.json';
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    window.claude.downloads.save({ filename: fname, data: json })
      .then(() => toast('Backup saved.'))
      .catch(() => {}); // viewer declined — nothing to clean up
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Backup downloaded.');
}

function importData(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const next = sanitizeState(parsed);
      if(!next || (!next.players.length && !next.matches.length)) throw new Error('empty');
      if(state.players.length || state.matches.length) confirmImport(next);
      else applyImport(next);
    } catch(e){
      toast('That file doesn’t look like a Game Week backup.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function applyImport(next){
  state = next;
  seqCounter = state.matches.reduce((m,x) => Math.max(m, x.seq || 0), 0);
  save(); closeSheet(); renderAll();
  toast('Backup imported — ' + state.players.length + ' players, ' + state.matches.length + ' games.');
}

/* Importing over a live scoreboard is irreversible — spell out both sides first. */
function confirmImport(next){
  openSheet(
    '<div class="sh-head"><h2>Replace this scoreboard?</h2>' +
      '<button class="close" id="shClose" aria-label="Close"><svg width="18" height="18"><use href="#i-x"/></svg></button></div>' +
    '<p style="font-size:14.5px; color:var(--ink2); margin:8px 0 0">This phone holds <b>' +
      state.players.length + ' players and ' + state.matches.length + ' games</b>. The backup holds <b>' +
      next.players.length + ' players and ' + next.matches.length + ' games</b>. ' +
      'Importing replaces everything here, and there’s no undo.</p>' +
    '<div class="foot"><button class="btn ghost" id="impCancel">Keep current</button>' +
    '<button class="btn danger-solid" id="impGo">Replace</button></div>'
  );
  $('#shClose').addEventListener('click', closeSheet);
  $('#impCancel').addEventListener('click', closeSheet);
  $('#impGo').addEventListener('click', () => applyImport(next));
}

/* =====================================================================
   NAVIGATION + INIT
===================================================================== */
function switchTab(tab){
  activeTab = tab;
  $$('.tabbar .tab').forEach(b => {
    if(b.dataset.tab === tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('#view-standings').hidden = tab !== 'standings';
  $('#view-history').hidden = tab !== 'history';
  $('#view-players').hidden = tab !== 'players';
  if(tab === 'standings') renderStandings();
}

$$('.tabbar .tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
$('#btnLog').addEventListener('click', () => openLogSheet(null));
$('#btnSettings').addEventListener('click', openSettingsSheet);
$('#sheetBack').addEventListener('click', requestCloseSheet);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#sheetHost').classList.contains('open')) requestCloseSheet();
});

// race chart hover / touch (delegated — the chart re-renders)
document.addEventListener('pointermove', e => {
  const wrap = e.target.closest && e.target.closest('#raceWrap');
  if(wrap) raceHover(e); else raceLeave();
});
document.addEventListener('pointerdown', e => {
  const wrap = e.target.closest && e.target.closest('#raceWrap');
  if(wrap) raceHover(e); else raceLeave();
});
// A scroll pan that starts on the chart cancels the pointer — don't strand the tooltip.
document.addEventListener('pointercancel', raceLeave);

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(activeTab === 'standings') renderRace(); }, 150);
});

load();
renderAll();
if(!storageOk){
  toast('Private browsing? Data can’t be saved on this device.');
}

// Offline support + self-update when served over http(s); a no-op for file://
// and sandboxed embeds. iOS home-screen apps often RESUME instead of reloading,
// so we re-check for updates every time the app becomes visible, and reload
// ourselves as soon as a new version has taken over.
let swReg = null;
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      swReg = reg;
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
  let hadSW = !!navigator.serviceWorker.controller;
  let reloadedForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadSW){ hadSW = true; return; }   // first install taking control, not an update
    if(reloadedForUpdate) return;
    reloadedForUpdate = true;
    if($('#sheetHost').classList.contains('open')){
      toast('Update ready — it loads next time you open the app.');
    } else {
      location.reload();
    }
  });
}

function checkForUpdates(){
  if(!swReg){ toast('You’re on the latest version.'); return; }
  toast('Checking for updates…');
  swReg.update().then(() => {
    setTimeout(() => {
      // if an update was found, controllerchange reloads the app on its own
      if(!(swReg.installing || swReg.waiting)) toast('You’re on the latest version.');
    }, 1500);
  }).catch(() => toast('Couldn’t check right now — try again when online.'));
}
